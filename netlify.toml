# Netlify config for the standalone site. Deploys are built locally and uploaded:
#   npm run deploy   (= check audio, npm run build, npx netlify-cli deploy --prod --dir dist; needs `npx netlify-cli login` once)
# There is deliberately no [build] command: the album audio is gitignored, so a build on Netlify's
# servers would publish a site whose films cannot play.

[build]
  publish = "dist"

# Work in progress: keep every page out of search engines.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Hashed Vite bundles.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Runtime data and models are copied as-is (not content-hashed), so keep them revalidating:
# edited journey/beat data must reach repeat visitors after a redeploy.
[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Fonts (also unhashed, but they never change).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Album audio: shorter, so a re-master reaches repeat visitors within a week.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
