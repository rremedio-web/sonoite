<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track 5 POC — GLB Preview</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #0d0d0f;
      color: #e8e6e3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.25rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #2a2a30;
      background: #141418;
    }

    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
      flex: 1;
    }

    label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: #b8b4ae;
    }

    select {
      min-width: 18rem;
      max-width: 100%;
      padding: 0.45rem 0.65rem;
      border: 1px solid #3a3a42;
      border-radius: 6px;
      background: #1c1c22;
      color: #f0ede8;
      font-size: 0.875rem;
    }

    select:focus {
      outline: 2px solid #6b8cff;
      outline-offset: 1px;
    }

    input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      accent-color: #6b8cff;
    }

    .model-label {
      font-size: 0.8125rem;
      color: #8a8680;
      max-width: 42rem;
      line-height: 1.4;
    }

    .viewer-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 5.5rem);
      background: radial-gradient(ellipse at center, #1a1a20 0%, #0d0d0f 70%);
      --poster-color: transparent;
    }

    .status {
      position: absolute;
      left: 1rem;
      bottom: 1rem;
      padding: 0.35rem 0.65rem;
      border-radius: 4px;
      background: rgba(20, 20, 24, 0.85);
      border: 1px solid #2a2a30;
      font-size: 0.75rem;
      color: #8a8680;
      pointer-events: none;
    }

    .status.error { color: #f08080; }
    .status.loading { color: #9eb4ff; }
  </style>
</head>
<body>
  <header>
    <h1>Track 5 POC — GLB Preview</h1>
    <div class="controls">
      <label>
        Model
        <select id="model-select" aria-label="Select GLB model"></select>
      </label>
      <label>
        <input type="checkbox" id="auto-rotate" />
        Auto-rotate
      </label>
    </div>
    <p class="model-label" id="model-description"></p>
    <p class="model-label">Prototype A/B: add <code>?textured=1</code> to the main prototype URL to load the textured optimized GLB (default stays generated).</p>
  </header>

  <div class="viewer-wrap">
    <model-viewer
      id="viewer"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="1"
      exposure="1"
      environment-image="neutral"
      alt="Track 5 relic GLB preview"
    ></model-viewer>
    <div class="status" id="status">Ready</div>
  </div>

  <script>
    const MODELS = [
      {
        id: 'generated',
        label: 'Generated optimized (main, untextured)',
        path: 'optimized/track5-relic-generated-optimized.glb',
        description: 'Main optimized mesh — no baked texture maps.',
        textured: false,
      },
      {
        id: 'textured',
        label: 'Textured optimized',
        path: 'optimized/track5-relic-textured-optimized.glb',
        description: 'Optimized mesh with baked texture maps.',
        textured: true,
      },
      {
        id: 'chamber',
        label: 'Blender chamber optimized (solid color)',
        path: 'optimized/track5-relic-blender-chamber-optimized.glb',
        description: 'Chamber variant — solid vertex/material color, no texture.',
        textured: false,
      },
      {
        id: 'legacy-generate',
        label: 'Meshy legacy generate (untextured)',
        path: 'Meshy_AI_symbol_0307145856_generate.glb',
        description: 'Original Meshy AI generate export — untextured.',
        textured: false,
      },
      {
        id: 'legacy-texture',
        label: 'Meshy legacy texture',
        path: 'Meshy_AI_symbol_0307145845_texture.glb',
        description: 'Original Meshy AI texture export.',
        textured: true,
      },
    ];

    const ALIASES = {
      generated: 'generated',
      main: 'generated',
      untextured: 'generated',
      textured: 'textured',
      texture: 'textured',
      chamber: 'chamber',
      blender: 'chamber',
      'legacy-generate': 'legacy-generate',
      legacy: 'legacy-generate',
      generate: 'legacy-generate',
      'legacy-texture': 'legacy-texture',
    };

    const select = document.getElementById('model-select');
    const viewer = document.getElementById('viewer');
    const description = document.getElementById('model-description');
    const status = document.getElementById('status');
    const autoRotateToggle = document.getElementById('auto-rotate');

    function resolveModelId(raw) {
      if (!raw) return MODELS[0].id;
      const key = raw.trim().toLowerCase();
      return ALIASES[key] || MODELS.find((m) => m.id === key)?.id || MODELS[0].id;
    }

    function setStatus(text, kind = '') {
      status.textContent = text;
      status.className = 'status' + (kind ? ' ' + kind : '');
    }

    function populateSelect(selectedId) {
      select.innerHTML = '';
      for (const model of MODELS) {
        const option = document.createElement('option');
        option.value = model.id;
        const tag = model.textured ? 'textured' : 'untextured';
        option.textContent = `${model.label} [${tag}]`;
        if (model.id === selectedId) option.selected = true;
        select.appendChild(option);
      }
    }

    function loadModel(modelId, updateQuery = true) {
      const model = MODELS.find((m) => m.id === modelId) || MODELS[0];
      populateSelect(model.id);
      description.textContent = model.description;
      setStatus('Loading…', 'loading');
      viewer.removeAttribute('auto-rotate');
      viewer.src = model.path;

      if (updateQuery) {
        const url = new URL(window.location.href);
        url.searchParams.set('model', model.id);
        window.history.replaceState({}, '', url);
      }
    }

    select.addEventListener('change', () => loadModel(select.value));

    autoRotateToggle.addEventListener('change', () => {
      if (autoRotateToggle.checked) {
        viewer.setAttribute('auto-rotate', '');
      } else {
        viewer.removeAttribute('auto-rotate');
      }
    });

    viewer.addEventListener('load', () => setStatus('Loaded'));
    viewer.addEventListener('error', () => setStatus('Failed to load model', 'error'));
    viewer.addEventListener('progress', (event) => {
      const pct = Math.round((event.detail.totalProgress || 0) * 100);
      if (pct < 100) setStatus(`Loading… ${pct}%`, 'loading');
    });

    const initialId = resolveModelId(new URLSearchParams(window.location.search).get('model'));
    loadModel(initialId, false);

    const url = new URL(window.location.href);
    url.searchParams.set('model', initialId);
    window.history.replaceState({}, '', url);
  </script>
</body>
</html>
